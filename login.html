<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supland | Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-card">

            <div class="logo-circle">S</div>

            <h1>Supland</h1>

            <p class="subtitle">
                ¡Bienvenido de nuevo!
            </p>

            <form>

                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    placeholder="correo@ejemplo.com"
                    required
                >

                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >

                <button type="submit">
                    Iniciar sesión
                </button>

            </form>

            <p class="register">
                ¿No tienes cuenta?
                <a href="#">Crear cuenta</a>
            </p>

            <a href="index.html" class="back">
                ← Volver a la tienda
            </a>

        </div>

    </div>

</body>
</html>
